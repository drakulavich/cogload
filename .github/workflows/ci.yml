name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      checks: write
    steps:
      - if: github.event_name == 'pull_request'
        uses: drakulavich/bite-the-diff@v1.1.0
        with:
          exclude: |
            tests/fixtures/busy-week/**
      - uses: actions/checkout@v7.0.1
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run test
        env:
          COGLOAD_REQUIRE_WEBVIEW: "1"
      - run: bun tests/fixtures/busy-week.ts && git status --porcelain -- tests/fixtures/busy-week | (! grep .)
      - run: npm install -g @anthropic-ai/claude-code
      - run: claude plugin validate . && claude plugin validate plugin && claude plugin test plugin
