name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run test
        env:
          ZAPARA_REQUIRE_WEBVIEW: "1"
      - run: npm install -g @anthropic-ai/claude-code
      - run: claude plugin validate . && claude plugin validate plugin && claude plugin test plugin
